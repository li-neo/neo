name: Deploy to Volcengine

on:
  push:
    branches: [main]

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install Python deps
        working-directory: server
        run: uv pip install --system -r pyproject.toml

      - name: Lint Python
        working-directory: server
        run: uv pip install --system ruff && ruff check .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install JS deps
        working-directory: apps/web
        run: pnpm install

      - name: Lint & Build frontend
        working-directory: apps/web
        run: pnpm build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/neo
            bash infra/scripts/auto-deploy.sh 2>&1

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### Deployment Successful" >> $GITHUB_STEP_SUMMARY
            echo "Deployed commit \`${{ github.sha }}\` to production." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "Failed to deploy commit \`${{ github.sha }}\`." >> $GITHUB_STEP_SUMMARY
            echo "Check the SSH step logs above for details." >> $GITHUB_STEP_SUMMARY
          fi
